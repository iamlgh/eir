# .github/workflows/generate_events_file.yml
name: Generate Events Files
on:
  #schedule:
  #  - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  generate_events:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a cron event."
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          uv sync --all-extras --dev
      - name: Generate events files
        run: |
          uv run python utils/schedule.py -u cron --skip-download --skip-publish
          echo "Ran at $(date)"
      - name: Upload generated files
        uses: actions/upload-artifact@v7
        with:
          name: events-files
          path: |
            data/greve_tra.ics
            data/manual_events.json
            data/month_map.json
            data/trampoline_events.json
          retention-days: 5
