<!DOCTYPE html>
<html lang="{{ t('app.lingua') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Calendar</title>
    <!-- IMPORT INTER FONT FROM GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- STANDARD JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/all/global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/locales/{{ t('app.lingua') }}/global.js"></script>

    <!-- THEME JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/forma/global.js"></script>

    <!-- STYLESHEETS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css' rel='stylesheet' />
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/forma/theme.css' rel='stylesheet' />
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/forma/palettes/blue.css' rel='stylesheet' />

    <style>
        /* For pc: large calendar, centered */
        #calendar {
            /*max-width: 900px;
            margin: 20px auto;*/
            width: 100%;
            min-height: 90vh;
            max-height: none;
        }

        :root, .fc, .fc-theme-forma {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }

        /* Mobile optimizations using Media Queries */
        @media (max-width: 768px) {
            html, body {
                margin: 0;
                padding: 0;
                height: 100dvh;
                overflow: hidden;
                overflow-y: auto !important;
            }

            #calendar {
                width: 100%;
                margin: 0;
                padding: 8px;
                box-sizing: border-box;
                /* Use min-height so it takes at least the viewport height, 
                   but can expand and scroll if content is longer */
                min-height: 100dvh;
                height: auto !important;
                overflow-y: visible !important;

                /* Make the titles and buttons smaller, so they don't overlap */
                .fc .fc-toolbar {
                    flex-direction: column;
                    gap: 10px;
                }

                .fc .fc-toolbar-title {
                    font-size: 1.2rem !important;
                }

                /* Target the internal flex container holding the time and title */
                /* .fc-forma-yi0 {
                  flex: 0 0 auto !important;
                  width: auto !important;
                  min-width: 0 !important;
                }*/

                .fc-forma-1El {
                  white-space: normal !important;
                  overflow: visible !important;
                  text-overflow: clip !important;
                }
            }
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var calendarEl = document.getElementById("calendar");

            function getInitialView() {
                return window.innerWidth < 768 ? 'listMonth' : 'dayGridMonth';
            }

            function getHeaderToolbar(isMobile) {
                return {
                    left: 'prev,next today',
                    center: 'title',
                    right: isMobile ? 'multiMonthYear,listMonth,listWeek' : 'multiMonthYear,dayGridMonth,listWeek'
                };
            }

            function getCalendarHeight() {
                return window.innerWidth < 768 ? '100dvh' : 'auto';
            }

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: getInitialView(),
                height: getCalendarHeight(), // '100dvh' on mobile to fill screen, 'auto' on desktop to fit content
                events: '/api/events?team_list=' + encodeURIComponent('{{ team_list }}') + '&dept=' + encodeURIComponent('{{ dept }}'),
                locale: "{{ t('app.lingua') }}",
                firstDay: 1,
                displayEventEnd: true,

                eventTimeFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    meridiem: false
                },

                headerToolbar: getHeaderToolbar(window.innerWidth < 768),

                footerToolbar: {
                    start: '',
                    center: 'mainMenu',
                    end: ''
                },

                buttons: {
                    /* Replace "Agenda" tab labels */
                    listMonth: { text: "{{ t('app.month') }}" },
                    listWeek: { text: "{{ t('app.week') }}" },
                    mainMenu: {
                        text: "{{ t('app.main_menu') }}", // e.g. "Hovedmenu"
                        click: function () {
                            window.location.href = "{{ url_for('member_menu') }}";
                        }
                    },
                },

                eventClick: function (info) {
                    alert("{{ t('app.event') }}: " + info.event.title + "\n{{ t('app.place') }}: " + info.event.extendedProps.place + "\n{{ t('app.address') }}: " + info.event.extendedProps.address + "\n{{ t('app.program') }}: " + info.event.extendedProps.program + "\n{{ t('app.deadline') }}: " + info.event.extendedProps.deadline);
                }
            });

            calendar.render();

            var observer = new ResizeObserver(function (entries) {
                if (!calendar.view) return;

                for (var entry of entries) {
                    var width = entry.contentRect.width;
                    var currentView = calendar.view.type;
                    var isMobile = width < 768;

                    if (isMobile) {
                        if (currentView === "dayGridMonth") {
                            calendar.changeView("listMonth");
                        }
                    } else {
                        if (currentView === "listMonth") {
                            calendar.changeView("dayGridMonth");
                        }
                    }

                    // v7 Direct Option Mutation
                    calendar.setOption('headerToolbar', getHeaderToolbar(isMobile));
                }
            });

            observer.observe(calendarEl);
        });
    </script>
</head>
<body>
    <div id="calendar"></div>
</body>
</html>
