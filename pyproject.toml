[project]
name = "eir"
version = "0.4.0"
description = "Addon app to manage team activities. Currently adds functionality to Conventus."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "bs4>=0.0.2",
    "cerberus>=1.3.8",
    "dotenv>=0.9.9",
    "flask>=3.1.2",
    "flask-caching>=2.4.0",
    "gunicorn>=26.0.0 ; sys_platform != 'win32'",
    "icalendar>=6.3.2",
    "mongoengine>=0.29.1",
    "paramiko>=4.0.0",
    "pymongo>=4.15.5",
    "python-i18n>=0.3.9",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "hatch>=1.16.1",
    "playwright>=1.60.0",
    "pre-commit>=4.6.2",
    "pytest>=9.0.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.18,<0.16.0",
    "types-paramiko>=5.0.0.20260724",
]

# pyproject.toml
[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
    "app/*_test.py",
]

[tool.ruff]
# Allow lines to be as long as 150 characters
line-length = 150
include = ["*.py"]
target-version = "py313"

[tool.ruff.format]
# Prefer single quotes over double quotes
quote-style = "single"

#[tool.ruff.lint]
#extend-select = [
#  "UP",  # pyupgrade
#  "D",   # pydocstyle
#]
#
#[tool.ruff.lint.pydocstyle]
#convention = "google"

[tool.mypy]
files = ["app/*.py", "utils/*.py"]
ignore_missing_imports = true
check_untyped_defs = true
mypy_path = "stubs/"

# pyright config, for using Zed editor
[tool.pyright]
include = ["app", "utils"]      # my source folders
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/.ruff_cache",
    ".vs",
    ".vscode",
]
stubPath = "stubs"

# Point pyright at your virtual environment so it resolves installed packages
venvPath = "."                  # directory containing the venv (find . -maxdepth 2 -iname "pyvenv.cfg")
venv = ".venv"                  # name of the venv folder

# Overall strictness
typeCheckingMode = "basic"      # options: "off", "basic", "standard", "strict"

# Fine-tune individual rules instead of an all-or-nothing mode
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportOptionalMemberAccess = "none"
reportGeneralTypeIssues = "warning"
reportUnusedImport = "warning"
reportUnboundVariable = "warning"
